:root{--r:#a92f3b;--g:#397562;--p:#fffdf9;--l:#eadfd5;--m:#776e67;--ink:#302a27}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(145deg,#f8eee6,#fffaf4,#edf6ef);color:var(--ink)}button,input,select,textarea{font:inherit}.app{max-width:1080px;margin:auto;padding:16px}.top,.row,.tools{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;gap:12px;align-items:center}.logo{background:var(--r);padding:13px;border-radius:16px;font-size:25px}h1{margin:0;font:700 24px Georgia}.muted{color:var(--m)}.language{width:auto;padding:7px 9px}.hero{background:linear-gradient(135deg,#7d202c,#b74049,#d16a57);color:#fff;padding:25px;border-radius:25px;margin:20px 0}.hero h2{font:700 38px Georgia;margin:5px 0}.btn{border:0;border-radius:12px;padding:10px 13px;font-weight:750;background:#eee5de;cursor:pointer}.primary{background:var(--r);color:#fff}.green{background:var(--g);color:#fff}.outline{background:transparent;border:1px solid var(--l)}.small{padding:7px 9px;font-size:12px}.bar{display:grid;grid-template-columns:1fr auto;gap:12px;margin-bottom:15px}.tools{justify-content:flex-end;flex-wrap:wrap}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;background:var(--p);padding:14px;border:1px solid var(--l);border-radius:18px;margin-bottom:15px}.metric{background:#f5ede6;padding:12px;border-radius:13px}.metric b{font-size:20px;display:block}.metric span{font-size:12px;color:var(--m)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;isolation:isolate}.photo{height:220px;min-height:220px;max-height:220px;overflow:hidden;position:relative;background:#fff;display:flex;align-items:center;justify-content:center;font-size:48px}.photo img{display:block;width:100%;height:100%;max-width:100%;max-height:100%;object-fit:contain;object-positio </style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">🎁</div><div><h1 data-i18n="appName">La Fabrique à Cadeaux</h1><div class="muted" data-i18n="tagline">Des listes joyeuses, sans doublons</div></div></div><div class="tools"><small id="sync">☁</small><select id="lang" class="language" onchange="setLanguage(this.value)"><option value="fr">FR</option><option value="en">EN</option><option value="de">DE</option></select></div></header><section class="hero"><b data-i18n="occasions">NOËL · ANNIVERSAIRES</b><h2 data-i18n="heroTitle">Des idées qui font briller les yeux.</h2><div data-i18n="heroText">Générez vos listes cadeaux en famille pour être sûr de faire plaisir !</div></section><div class="bar"><select id="listSelect" onchange="active=this.value;render()"></select><div class="tools"><button class="btn outline" onclick="openMembers()" data-i18n="members">👨‍👩‍👧 Membres</button><button class="btn outline" onclick="openLists()" data-i18n="lists">📋 Listes</button><button class="btn outline" onclick="openAdmin()" id="adminBtn">🔒 Admin</button><button class="btn green" onclick="shareList()" data-i18n="share">↗ Partager</button><button class="btn primary" onclick="openGift()" data-i18n="addGift">＋ Cadeau</button></div></div><section class="summary"><div class="metric"><b id="n">0</b><span data-i18n="ideas">idées</span></div><div class="metric"><b id="free">0</b><span data-i18n="availablePlural">disponibles</span></div><div class="metric"><b id="taken">0</b><span data-i18n="reservedPlural">réservées</span></div><div class="metric" id="budgetMetric" style="display:none"><b id="total">0 €</b><span data-i18n="spending">dépenses, admin</span></div></section><main id="grid" class="grid"></main></div>

ive it',reserve:'Reserve',membersTitle:'Members',add:'Add',listsBudgets:'Lists and budgets',available:'Available',planned:'Surprise planned',reserved:'Reserved',shop:'Shop ↗',edit:'Edit',remove:'Delete',adminRequired:'🔒 Admin required.',privateBudgets:'🔒 Budgets are visible to the admin.',copied:'Link copied',noGift:'No gifts yet'},de:{appName:'Die Geschenkewerkstatt',tagline:'Schöne Listen, keine Doppelkäufe',occasions:'WEIHNACHTEN · GEBURTSTAGE',heroTitle:'Ideen, die Augen zum Leuchten bringen.',heroText:'Erstellen Sie gemeinsam Geschenklisten, damit jedes Geschenk Freude macht!',members:'👨‍👩‍👧 Mitglieder',lists:'📋 Listen',share:'↗ Teilen',addGift:'＋ Geschenk',ideas:'Ideen',availablePlural:'verfügbar',reservedPlural:'reserviert',spending:'Ausgaben, Admin',gift:'Geschenk',forWhom:'Für wen?',occasion:'Anlass',name:'Name',price:'Preis (€)',productLink:'Produktlink',getPhoto:'✨ Foto abrufen',photo:'Foto',details:'Details',save:'Speichern',offerGift:'Ich schenke es',reserve:'Reservieren',membersTitle:'Mitglieder',add:'Hinzufügen',listsBudgets:'Listen und Budgets',available:'Verfügbar',planned:'Überraschung geplant',reserved:'Reserviert',shop:'Shop ↗',edit:'Bearbeiten',remove:'Löschen',adminRequired:'🔒 Admin erforderlich.',privateBudgets:'🔒 Budgets sind nur für den Admin sichtbar.',copied:'Link kopiert',noGift:'Noch keine Geschenke'}};const tr=k=>T[language][k]||k,esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function setLanguage(x){language=x;localStorage.giftLang=x;document.documentElement.lang=x;$('lang').value=x;document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));render()}function family(){let q=new URLSearchParams(location.search),x=q.get('family')||localStorage.familyId||('famille-'+Math.random().toString(36).slice(2,10));return localStorage.familyId=x.replace(/[^\w-]/g,'-')}function id(){return crypto.randomUUID()}async function digest(x){return[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x)))].map(x=>x.toString(16).padStart(2,'0')).join('')}async function start(){setLanguage(language);try{firebase.initializeApp(C);await firebase.auth().signInAnonymously();ref=firebase.database().ref('families/'+family());ref.on('value',s=>{receiving=true;D=s.val()||{lists:{noel:{name:'Noël en famille',gifts:{},budgets:{}}},members:['Famille'],adminHash:''};active=active||new URLSearchParams(location.search).get('list')||Object.keys(D.lists)[0];render();receiving=false;if(!s.val())save();$('sync').textContent='☁'},fail)}catch(e){fail(e)}}function fail(e){$('sync').textContent='⚠';toast(e.message)}function save(){render();if(ref&&!receiving)ref.set(D).catch(fail)}function cur(){return D.lists[active]}function gifts(){return Object.values(cur()?.gifts||{})}function safeUrl(u){try{const x=new URL(u);return ['http:','https:'].includes(x.protocol)?x.href:''}catch(e){return''}}function render(){$('listSelect').innerHTML=Object.entries(D.lists).map(([k,v])=>`<option value="${k}" ${k===active?'selected':''}>${esc(v.name)}</option>`).join('');let opts=D.members.map(x=>`<option>${esc(x)}</option>`).join('');$('person').innerHTML=opts;$('giver').innerHTML=opts;let a=gifts();$('n').textContent=a.length;$('free').textContent=a.filter(x=>!x.giver).length;$('taken').textContent=a.filter(x=>x.giver).length;$('budgetMetric').style.display=admin?'block':'none';$('total').textContent=a.reduce((x,g)=>x+(+g.price||0),0).toLocaleString(language)+' €';$('grid').innerHTML=a.length?a.map(g=>{const product=safeUrl(g.link);return `<article class="card"><div class="photo">${g.image?`<img src="${esc(g.image)}" alt="${esc(g.name)}" onerror="this.remove();this.parentElement.textContent='🎁'">`:'🎁'}</div><div class="body"><div class="row"><div><small>${esc(g.occasion)}</small><h3>${esc(g.name)}</h3><span class="muted">${esc(g.person)}</span></div><span class="status ${g.giver?'reserved':''}">${g.giver?(admin?tr('reserved'):tr('planned')):tr( function openGift(x=''){let g=cur().gifts?.[x];$('giftForm').reset();$('gid').value='';if(g){for(const[k,v]of Object.entries({gid:g.id,person:g.person,occasion:g.occasion,gname:g.name,price:g.price,link:g.link,image:g.image,desc:g.desc}))$(k).value=v||''}$('giftModal').classList.add('open')}$('giftForm').onsubmit=e=>{e.preventDefault();let x=$('gid').value||id(),old=cur().gifts?.[x],product=safeUrl($('link').value);if($('link').value&&!product)return toast('URL invalide');cur().gifts=cur().gifts||{};cur().gifts[x]={id:x,person:$('person').value,occasion:$('occasion').value,name:$('gname').value,price:+$('price').value||0,link:product,image:$('image').value,desc:$('desc').value,giver:old?.giver||''};closeM('giftModal');save()};async function findPhoto(){let u=safeUrl($('link').value);if(!u||$('image').value)return;try{let j=await(await fetch('https://api.microlink.io/?url='+encodeURIComponent(u)+'&meta.image=true')).json();$('image').value=j.data.image.url;$('imageStatus').textContent='✓'}catch(e){$('imageStatus').textContent='—'}}function reserveGift(x){$('rid').value=x;$('reserveModal').classList.add('open')}$('reserveForm').onsubmit=e=>{e.preventDefault();cur().gifts[$('rid').value].giver=$('giver').value;closeM('reserveModal');save()};function delGift(x){if(admin&&confirm('?')){delete cur().gifts[x];save()}}

atch(e){prompt('',u)}}function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}start();
